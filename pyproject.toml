[project]
name = "paperless-field-extractor"
version = "0.1.0"
description = "Deterministic extraction of receipt amounts and dates into Paperless-ngx custom fields."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
paperless-field-extractor = "paperless_field_extractor.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-socket>=0.8.1",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
