name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true

            - name: Check Dockerfile Python matches .python-version
              run: |
                  expected="$(tr -d '[:space:]' < .python-version)"
                  actual="$(sed -n 's/^FROM python:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile)"
                  if [ "$expected" != "$actual" ]; then
                      echo "Dockerfile uses Python '$actual' but .python-version is '$expected'" >&2
                      exit 1
                  fi

            # The runner image pins the Ubuntu package versions, so key the cache on it:
            # a new image gets a fresh cache instead of stale .deb files.
            - name: Read runner image version
              id: runner-image
              run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

            - name: Cache OCR tool packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/apt-cache
                  key: apt-ocr-v1-${{ runner.os }}-${{ steps.runner-image.outputs.version }}

            - name: Install OCR tools
              run: |
                  mkdir -p "$HOME/apt-cache/partial"
                  sudo apt-get update
                  sudo apt-get -o Dir::Cache::archives="$HOME/apt-cache" install -y --no-install-recommends \
                      tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn poppler-utils
                  sudo chown -R "$USER" "$HOME/apt-cache"

            - name: Install dependencies
              run: uv sync --locked

            - name: Ruff lint
              run: uv run ruff check

            - name: Ruff format
              run: uv run ruff format --check

            - name: Mypy
              run: uv run mypy

            - name: Pytest
              env:
                  # The real-tool OCR tests must run here, never skip.
                  REQUIRE_OCR_TOOLS: '1'
              run: uv run pytest
